          const data = localStorage.getItem(this.STORAGE_KEY);
          return data ? JSON.parse(data) : this.resetToDefaults();
        } catch (e) {
          this.resetToDefaults();
          return JSON.parse(localStorage.getItem(this.STORAGE_KEY));
        }
      }

      save(data) {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
      }

      getUsers() { return this.getDB().users || []; }
      
      getUserByLogin(login) {
        return this.getUsers().find(u => u.login.toLowerCase() === login.trim().toLowerCase());
      }

      addUser(user) {
        const db = this.getDB();
        if (db.users.some(u => u.login.toLowerCase() === user.login.toLowerCase())) {
          throw new Error('Ushbu login band!');
        }
        db.users.push(user);
        this.save(db);
      }

      deleteUser(id) {
        const db = this.getDB();
        db.users = db.users.filter(u => u.id !== id);
        this.save(db);
      }

      getHomeworks() { return this.getDB().homeworks || []; }
      
      addHomework(hw) {
        const db = this.getDB();
        db.homeworks.unshift(hw);
        this.save(db);
      }

      getSubmissions() { return this.getDB().submissions || []; }
      
      submitHomework(sub) {
        const db = this.getDB();
        const index = db.submissions.findIndex(s => s.homeworkId === sub.homeworkId && s.studentId === sub.studentId);
        if (index !== -1) {
          db.submissions[index] = { ...db.submissions[index], ...sub };
        } else {
          db.submissions.push(sub);
        }
        this.save(db);
      }

      gradeSubmission(submissionId, grade, feedback) {
        const db = this.getDB();
        const sub = db.submissions.find(s => s.id === submissionId);
        if (sub) {
          sub.grade = grade;
          sub.feedback = feedback;
          sub.status = 'graded';
          this.save(db);
        }
      }

      getChatMessages() { return this.getDB().chatMessages || []; }
      
      addChatMessage(msg) {
        const db = this.getDB();
        db.chatMessages.push(msg);
        this.save(db);
      }

      getCustomBg() {
        return this.getDB().customBg || '';
      }

      setCustomBg(bg) {
        const db = this.getDB();
        db.customBg = bg;
        this.save(db);
      }
      updateUserProfile(id, patch) {
        const db = this.getDB();
        const user = db.users.find(u => u.id === id);
        if (!user) throw new Error("Foydalanuvchi topilmadi!");
        Object.assign(user, patch);
        this.save(db);
        return user;
      }

      getUserById(id) {
        return this.getUsers().find(u => u.id === id);
      }

    }

      const container = document.createElement('div');

      container.innerHTML = `

    function renderChatContent() {
      const container = document.createElement('div');

      container.innerHTML = `

            </div>
          `).join('')}
        </div>
        <form id="chat-form" class="p-3 bg-slate-900/80 border-t border-brand-border flex gap-2">
          <input type="text" id="chat-input" placeholder="Xabar yozing..." required class="flex-1 glass-input px-3 py-2 rounded-xl text-xs text-white focus:outline-none">
          <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-bold transition">Yuborish</button>
        </form>
      `;

      setTimeout(() => {
        const box = container.querySelector('#chat-messages');
        if (box) box.scrollTop = box.scrollHeight;
        const form = container.querySelector('#chat-form');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const txt = container.querySelector('#chat-input').value.trim();
          if (!txt) return;
          DB.addChatMessage({
            senderId: AppState.currentUser.id,
            senderName: AppState.currentUser.name,
            text: txt,
            time: new Date().toLocaleTimeString()
          });
          renderApp();
        });
      }, 0);

      return container;
    }

              <input type="text" id="grade-feedback" placeholder="Izoh (ixtiyoriy)" class="w-full glass-input px-3 py-2 rounded-xl text-xs text-white">
              <div class="flex gap-2 pt-2">
                <button type="submit" class="flex-1 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold">Saqlash</button>
                <button type="button" onclick="closeModal()" class="flex-1 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs">Bekor qilish</button>
              </div>
            </form>
          </div>
        </div>
      `;
      document.getElementById('grade-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const g = document.getElementById('grade-val').value;
        const fb = document.getElementById('grade-feedback').value;
        DB.gradeSubmission(subId, g, fb);
        closeModal();
        showToast("Baho qo'yildi!");
        renderApp();
      });
    };

    window.deleteUser = function(id) {
      if (confirm("Haqiqatan ham o'chirmoqchimisiz?")) {
        DB.deleteUser(id);
        showToast("Foydalanuvchi o'chirildi!");
        renderApp();
      }
    };


    // Professional profil: ism/familiya, avatar va 10 xil ramka
    window.openProfileModal = function() {
      const user = DB.getUserById(AppState.currentUser.id) || AppState.currentUser;
      const mc = document.getElementById('modal-container');
      mc.innerHTML = `
        <div class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-3 md:p-5 z-50 fade-in">
          <div class="glass-card premium-card profile-modal-wide rounded-3xl border border-slate-700/80 overflow-hidden">
            <div class="relative p-5 md:p-7">
              <div class="absolute -top-20 -right-20 w-56 h-56 rounded-full bg-fuchsia-500/10 blur-3xl"></div>
              <div class="absolute -bottom-24 -left-20 w-64 h-64 rounded-full bg-cyan-500/10 blur-3xl"></div>

              <div class="relative flex items-start justify-between gap-4 mb-5">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="sparkle text-xl">✨</span>
                    <h3 class="font-black text-xl md:text-2xl text-white">Profilimni sozlash</h3>
                  </div>
                  <p class="text-xs text-slate-400 mt-1">Rasm, ism va sayt bo'ylab ko'rinadigan 10 xil premium ramkani boshqaring.</p>
                </div>
                <button onclick="closeModal()" class="w-10 h-10 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>

              <div class="profile-hero rounded-3xl p-5 md:p-6 mb-6">
                <div class="flex flex-col lg:flex-row items-center lg:items-start gap-6">
                  <div class="flex flex-col items-center gap-2 shrink-0">
                    <div id="profile-live-avatar">
                      ${avatarMarkup(user, 'w-44 h-44')}
                    </div>
                    <span class="text-[10px] uppercase tracking-[.22em] text-cyan-300 font-black">Profilim</span>
                  </div>

                  <div class="flex-1 w-full grid md:grid-cols-2 gap-4">
                    <div>
                      <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Ism</label>
                      <input id="profile-name" value="${(user.name || '').replace(/"/g,'&quot;')}" class="w-full glass-input px-3.5 py-3.5 rounded-xl text-sm text-white">
                    </div>
                    <div>
                      <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Familiya</label>
                      <input id="profile-surname" value="${(user.surname || '').replace(/"/g,'&quot;')}" class="w-full glass-input px-3.5 py-3.5 rounded-xl text-sm text-white">
                    </div>
                    <div class="md:col-span-2 flex flex-col sm:flex-row gap-2">
                      <label class="cursor-pointer flex-1">
                        <input id="profile-avatar-file" type="file" accept="image/*" class="hidden">
                        <span class="flex items-center justify-center gap-2 w-full px-4 py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 via-violet-600 to-cyan-600 hover:brightness-110 text-white text-xs font-black transition shadow-lg">
                          <i class="fa-solid fa-camera"></i> Profil rasmini almashtirish
                        </span>
                      </label>
                      <button type="button" onclick="removeProfileAvatar()" class="sm:w-48 px-4 py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-rose-300 text-xs font-bold transition border border-slate-700">
                        <i class="fa-solid fa-trash-can mr-1"></i> Rasmni olib tashlash
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="rounded-3xl bg-slate-950/35 border border-slate-700/70 p-4 md:p-5">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-4">
                  <div>
                    <p class="text-sm font-black text-white">✨ Sayt bo'ylab premium ramka</p>
                    <p class="text-[10px] text-slate-500 mt-0.5">Tanlagan ramkangiz header va profil rasmingiz ko'rinadigan barcha joylarda ishlaydi.</p>
                  </div>
                  <span id="frame-name" class="self-start sm:self-auto text-[10px] font-black text-cyan-300 bg-cyan-400/10 border border-cyan-400/20 px-3 py-1.5 rounded-full">${PROFILE_FRAMES.find(f => f.id === Number(user.frame || 1))?.name || 'Neon'}</span>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-10 gap-2.5">
                  ${PROFILE_FRAMES.map(frame => `
                    <button type="button" onclick="selectProfileFrame(${frame.id})"
                      class="frame-preview ${frame.cls} ${Number(user.frame || 1) === frame.id ? 'selected' : ''}">
                      <div class="frame-icon mx-auto"><i class="fa-solid fa-user text-slate-300"></i></div>
                      <span class="block text-[9px] font-bold text-white mt-1.5 truncate">${frame.id}. ${frame.name}</span>
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="flex flex-col sm:flex-row gap-2 pt-5">
                <button onclick="saveProfile()" class="flex-1 py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 via-violet-600 to-cyan-600 hover:brightness-110 text-white text-xs font-black shadow-lg transition">
                  <i class="fa-solid fa-floppy-disk mr-1"></i> O'zgarishlarni saqlash
                </button>
                <button onclick="closeModal()" class="sm:w-40 py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition">
                  Bekor qilish
                </button>
              </div>
            </div>
          </div>
        </div>
      `;

      window.__profileDraft = {
        avatar: user.avatar || '',
        frame: Number(user.frame || 1)
      };

      const fileInput = document.getElementById('profile-avatar-file');
      fileInput?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showToast("Faqat rasm faylini tanlang!", 'error');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          window.__profileDraft.avatar = reader.result;
          refreshProfilePreview();
        };
        reader.readAsDataURL(file);
      });
    };

    function refreshProfilePreview() {
      const user = DB.getUserById(AppState.currentUser.id) || AppState.currentUser;
      const previewUser = { ...user, avatar: window.__profileDraft?.avatar || '', frame: window.__profileDraft?.frame || 1 };
      const box = document.getElementById('profile-live-avatar');
      if (box) box.innerHTML = avatarMarkup(previewUser, 'w-44 h-44');
      const name = PROFILE_FRAMES.find(f => f.id === Number(previewUser.frame))?.name || 'Neon';
      const label = document.getElementById('frame-name');
      if (label) label.textContent = name;
      document.querySelectorAll('.frame-preview').forEach((el, i) => {
        el.classList.toggle('selected', i + 1 === Number(previewUser.frame));
      });
    }

    window.selectProfileFrame = function(frameId) {
      window.__profileDraft = window.__profileDraft || {};
      window.__profileDraft.frame = frameId;
      refreshProfilePreview();
    };

    window.removeProfileAvatar = function() {
      window.__profileDraft = window.__profileDraft || {};
      window.__profileDraft.avatar = '';
      refreshProfilePreview();
    };

    window.saveProfile = function() {
      const name = document.getElementById('profile-name')?.value.trim();
      const surname = document.getElementById('profile-surname')?.value.trim();
      if (!name) {
        showToast("Ism bo'sh bo'lishi mumkin emas!", 'error');
        return;
      }
      const updated = DB.updateUserProfile(AppState.currentUser.id, {
        name,
        surname,
        avatar: window.__profileDraft?.avatar || '',
        frame: Number(window.__profileDraft?.frame || 1)
      });
      AppState.currentUser = updated;
      sessionStorage.setItem('edutask_user', JSON.stringify(updated));
      closeModal();
      renderApp();
      showToast("Profil muvaffaqiyatli yangilandi!", 'success');
    };

    // Fon almashtirish modal oynasi va 10 ta fon rasmlari
    window.openBgModal = function() {
      const bgImages = [
        'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1920&q=80'
      ];

      const mc = document.getElementById('modal-container');
      mc.innerHTML = `
        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
          <div class="glass-card w-full max-w-lg p-5 rounded-2xl border border-brand-border space-y-4">
            <div class="flex justify-between items-center">
              <h3 class="font-bold text-sm text-white">🎨 10 xil Fon Rasmini Tanlang</h3>
              <button onclick="setCustomBg('')" class="text-xs text-rose-400 hover:underline">Fonsiz (Standart)</button>
            </div>
            <div class="grid grid-cols-5 gap-2 max-h-60 overflow-y-auto p-1">
              ${bgImages.map((url, idx) => `
                <div onclick="setCustomBg('${url}')" class="h-14 rounded-lg cursor-pointer bg-cover bg-center border-2 border-transparent hover:border-brand-accent transition transform hover:scale-105 shadow" style="background-image: url('${url}')"></div>
              `).join('')}
            </div>
            <div class="flex justify-end pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">Yopish</button>
            </div>
          </div>
        </div>
      `;
    };

    window.setCustomBg = function(url) {
      DB.setCustomBg(url);
      applyBackground();
      closeModal();
      showToast("Fon rasmi o'zgartirildi!");
    };

    renderApp();
  </script>
</body>
</html>
